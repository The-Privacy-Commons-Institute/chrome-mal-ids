---
title: Chrome/Edge Extension Reported Malicious — Classification Divergent
id: chrome-mal-ids-sigma-divergent
status: experimental
description: >
    Extension IDs reported malicious by a contributing source where TPCI
    Stage 5A static analysis of the currently published package produced no
    findings above its reporting threshold. The two methods do not agree;
    neither result overrides the other. The source classification is retained
    and these IDs remain published, with the divergence recorded so it can be
    weighted separately. A below-threshold result is NOT a safety verification
    — static analysis can be evaded and extensions change after analysis.
    Raise the level or merge into the main rule if your environment prefers
    the stricter posture. Covers 103 extension IDs.
    Source: https://github.com/The-Privacy-Commons-Institute/chrome-mal-ids
